name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install pods
        run: pod install
      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace "xkcd Open Source.xcworkspace" \
            -scheme xkcdOSTests \
            -destination 'platform=iOS Simulator,name=iPhone 15'
